<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1E2A" />

    <!-- Resource hints — speed up font and asset loading (Core Web Vitals) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Web app manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Fallback title / description (overwritten per-page by useSEO hook) -->
    <title>Septentrion Dent — World-Class Medical Tourism in Albania</title>
    <meta name="description" content="Septentrion Dent connects international patients with accredited clinics in Albania for dental implants, veneers, and full-arch restorations—saving up to 70% vs Western Europe." />

    <!-- Content language — tells Google this is English for international audiences -->
    <meta http-equiv="content-language" content="en" />
    <meta name="language" content="English" />

    <!-- hreflang — signals target audience regions to Google
         x-default catches all other regions not listed -->
    <link rel="alternate" hreflang="en"    href="https://septentriondent.com" />
    <link rel="alternate" hreflang="en-gb" href="https://septentriondent.com" />
    <link rel="alternate" hreflang="en-us" href="https://septentriondent.com" />
    <link rel="alternate" hreflang="en-ie" href="https://septentriondent.com" />
    <link rel="alternate" hreflang="en-au" href="https://septentriondent.com" />
    <link rel="alternate" hreflang="en-ca" href="https://septentriondent.com" />
    <link rel="alternate" hreflang="x-default" href="https://septentriondent.com" />

    <!-- Fallback Open Graph -->
    <meta property="og:title"       content="Septentrion Dent — World-Class Medical Tourism in Albania" />
    <meta property="og:description" content="End-to-end medical tourism facilitation, BPO, and digital solutions based in Tirana, Albania." />
    <meta property="og:image"       content="https://septentriondent.com/og-cover.jpg" />
    <meta property="og:url"         content="https://septentriondent.com" />
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Septentrion Dent" />
    <meta property="og:locale"      content="en_GB" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Septentrion Dent — World-Class Medical Tourism in Albania" />
    <meta name="twitter:description" content="End-to-end medical tourism facilitation, BPO, and digital solutions based in Tirana, Albania." />
    <meta name="twitter:image"       content="https://septentriondent.com/og-cover.jpg" />

    <!-- Canonical -->
    <link rel="canonical" href="https://septentriondent.com" />

    <!-- Favicon — multi-size for crisp rendering in all browsers/tabs -->
    <link rel="icon"             href="/favicon.ico" sizes="any" />
    <link rel="icon"             href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon"             href="/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

    <!-- JSON-LD structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MedicalBusiness",
      "name": "Septentrion Dent",
      "url": "https://septentriondent.com",
      "telephone": "+442045772065",
      "email": "info@septentriondent.com",
      "description": "Medical tourism facilitation, BPO and digital solutions based in Tirana, Albania.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Tirana",
        "addressCountry": "AL"
      },
      "areaServed": [
        { "@type": "Country", "name": "United Kingdom" },
        { "@type": "Country", "name": "United States" },
        { "@type": "Country", "name": "Ireland" },
        { "@type": "Country", "name": "Australia" },
        { "@type": "Country", "name": "Canada" },
        { "@type": "Country", "name": "Germany" },
        { "@type": "Country", "name": "Switzerland" },
        { "@type": "Country", "name": "Austria" },
        { "@type": "Country", "name": "Italy" },
        { "@type": "Country", "name": "France" }
      ],
      "sameAs": [
        "https://www.instagram.com/septentriongroup",
        "https://www.linkedin.com/company/septentrion-group/",
        "mailto:info@septentriondent.com"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
